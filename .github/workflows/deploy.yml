name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    # Skips quietly until the Cloudflare secrets have been added (docs/SETUP.md).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Render production config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: npm run render-config
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote -c wrangler.deploy.json
      - name: Deploy Worker and app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.deploy.json
      - name: Set Worker secrets (Access check, optional AI and Google keys)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          OLLAMA_ACCESS_CLIENT_ID: ${{ secrets.OLLAMA_ACCESS_CLIENT_ID }}
          OLLAMA_ACCESS_CLIENT_SECRET: ${{ secrets.OLLAMA_ACCESS_CLIENT_SECRET }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GROCERY_SHEET_ID: ${{ secrets.GROCERY_SHEET_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        run: |
          node -e '
            const e = process.env;
            if (!e.ACCESS_TEAM_DOMAIN || !e.ACCESS_AUD) { console.error("ACCESS_TEAM_DOMAIN and ACCESS_AUD secrets are required"); process.exit(1); }
            const keys = ["ACCESS_TEAM_DOMAIN", "ACCESS_AUD", "ANTHROPIC_API_KEY", "BRAVE_API_KEY", "OLLAMA_URL", "OLLAMA_ACCESS_CLIENT_ID", "OLLAMA_ACCESS_CLIENT_SECRET", "GOOGLE_SERVICE_ACCOUNT", "GROCERY_SHEET_ID", "DROPBOX_APP_KEY", "DROPBOX_APP_SECRET"];
            const out = Object.fromEntries(keys.filter((k) => e[k]).map((k) => [k, e[k]]));
            console.log("Setting:", Object.keys(out).join(", "));
            require("fs").writeFileSync("worker-secrets.json", JSON.stringify(out));
          '
          npx wrangler secret bulk worker-secrets.json -c wrangler.deploy.json
          rm worker-secrets.json

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    # Skips quietly until the Cloudflare secrets have been added (docs/SETUP.md).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Render production config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: npm run render-config
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote -c wrangler.deploy.json
      - name: Deploy Worker and app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.deploy.json
      - name: Set Worker secrets for the Access check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          node -e 'const {ACCESS_TEAM_DOMAIN:t, ACCESS_AUD:a} = process.env; if (!t || !a) { console.error("ACCESS_TEAM_DOMAIN and ACCESS_AUD secrets are required"); process.exit(1); } require("fs").writeFileSync("access-secrets.json", JSON.stringify({ACCESS_TEAM_DOMAIN: t, ACCESS_AUD: a}))'
          npx wrangler secret bulk access-secrets.json -c wrangler.deploy.json
          rm access-secrets.json
